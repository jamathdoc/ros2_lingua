name: Assign Issue
on:
  schedule:
    - cron: "0 0 * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  assign:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Assign the user or unassign stale assignments
        uses: takanome-dev/assign-issue-action@beta
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          maintainers: "purahan"
          assigned_newcomer_text: |
            Hey @{{ handle }}, thanks for jumping in! 🎉

            Take a look at [CONTRIBUTING.md](CONTRIBUTING.md) to get set up, and feel free to ask questions here if you get stuck.

            > This issue auto-unassigns after **{{ total_days }} days** of inactivity.
